<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nurse avatar demo</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 16px; color: #222; }
  .row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  #stage { width: 512px; height: 512px; background: #eef2f6; border-radius: 8px; }
  .panel { min-width: 300px; }
  label { display: block; margin-top: 8px; font-size: 13px; color: #555; }
  input[type=text], input[type=number] { width: 260px; padding: 4px; }
  button { margin: 6px 6px 0 0; padding: 6px 12px; }
  #status { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre; background: #f6f7f9;
            padding: 8px; border-radius: 6px; margin-top: 10px; }
  .note { font-size: 12px; color: #777; margin-top: 10px; max-width: 320px; }
  #transcript { font-size: 14px; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 8px;
                margin-top: 10px; min-height: 60px; white-space: pre-wrap; }
  #partial { color: #999; font-style: italic; }
  #nurse { font-size: 14px; background: #eef6ff; border: 1px solid #cfe2ff; border-radius: 6px; padding: 8px;
           margin-top: 10px; min-height: 40px; }
</style>
</head>
<body>
<div class="row">
  <canvas id="stage" width="512" height="512"></canvas>
  <div class="panel">
    <label>Server URL</label>
    <input type="text" id="url" value="ws://127.0.0.1:8765">
    <label>Prebuffer (seconds)</label>
    <input type="number" id="prebuffer" value="4.0" step="0.5" min="0">
    <div>
      <button id="connect">Connect</button>
      <button id="disconnect" disabled>Disconnect</button>
    </div>
    <label>Speech (16 kHz mono WAV, stands in for the nurse's TTS)</label>
    <input type="file" id="wav" accept=".wav">
    <div>
      <button id="speak" disabled>Play speech</button>
      <button id="interrupt" disabled>Interrupt</button>
    </div>
    <label>Patient microphone (ElevenLabs Scribe)</label>
    <div>
      <button id="mic" disabled>Start mic</button>
    </div>
    <div id="transcript"></div>
    <div id="nurse"></div>
    <div id="partial"></div>
    <div id="status">not connected</div>
    <div class="note">
      Video and audio are scheduled on the same audio clock, so lips and voice stay in step.
      When no frames are playing, the still nurse image is shown.
      Mic input is not wired yet.
    </div>
  </div>
</div>

<script>
const STILL_IMAGE = "../figures/nurse_image3.png";
const SAMPLES_PER_FRAME = 640;          // 16 kHz / 25 fps
const FRAME_S = SAMPLES_PER_FRAME / 16000;
const CHUNK_BYTES = 3200;               // 100 ms of int16 at 16 kHz

const $ = id => document.getElementById(id);
const canvas = $("stage");
const g = canvas.getContext("2d");
const still = new Image();
still.src = STILL_IMAGE;

let ws = null;
let actx = null;            // audio context (16 kHz requested; browser resamples)
let nextAudioTime = 0;      // when the next audio buffer starts
let queue = [];             // {bitmap, playAt} waiting to be drawn
let sources = [];           // scheduled audio sources, so Interrupt can stop them
let decodeChain = Promise.resolve();
let lastDrawAt = 0;
let lastFrameAt = 0;
let framesIn = 0, framesDrawn = 0, underruns = 0, maxGap = 0, lastArrival = 0;
let started = false;
let speaking = false;
let statsTimer = null;
let micStream = null, micCtx = null, micNode = null, scribeWs = null;

function setStatus(extra) {
  const state = ws ? (ws.readyState === 1 ? "connected" : "connecting") : "not connected";
  const ahead = actx ? Math.max(0, nextAudioTime - actx.currentTime) : 0;
  $("status").textContent =
    `${state}\n` +
    `frames in: ${framesIn}   drawn: ${framesDrawn}\n` +
    `audio ahead: ${ahead.toFixed(2)} s\n` +
    `queued video: ${queue.length} frames\n` +
    `underruns: ${underruns}   largest arrival gap: ${maxGap.toFixed(2)} s\n` +
    (extra || "");
}

function ensureAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  if (actx.state === "suspended") actx.resume();
}

function drawLoop() {
  const now = actx ? actx.currentTime : 0;
  let f = null;
  while (queue.length && queue[0].playAt <= now) f = queue.shift();
  if (f) {
    g.drawImage(f.bitmap, 0, 0, canvas.width, canvas.height);
    lastDrawAt = now;
    framesDrawn++;
  } else if (!queue.length && (now - lastDrawAt > 0.25 || lastDrawAt === 0)) {
    if (still.complete) {
      // centre square crop, so the photo is not stretched onto the square canvas
      const side = Math.min(still.naturalWidth, still.naturalHeight);
      const sx = (still.naturalWidth - side) / 2, sy = (still.naturalHeight - side) / 2;
      g.drawImage(still, sx, sy, side, side, 0, 0, canvas.width, canvas.height);
    }
  }
  requestAnimationFrame(drawLoop);
}

function onFrame(buf) {
  const view = new DataView(buf);
  const jpegLen = view.getUint32(0, true);
  const jpeg = new Uint8Array(buf, 4, jpegLen);
  const pcm = new Int16Array(buf.slice(4 + jpegLen));
  const t = performance.now();
  if (lastArrival) maxGap = Math.max(maxGap, (t - lastArrival) / 1000);
  lastArrival = t;
  framesIn++;
  lastFrameAt = t;

  // keep decode order, then schedule the audio and tie the video frame to its start time
  decodeChain = decodeChain.then(() => createImageBitmap(new Blob([jpeg], { type: "image/jpeg" })))
    .then(bitmap => {
      const earliest = actx.currentTime + 0.05;
      if (nextAudioTime < earliest) {
        if (framesIn > 1) underruns++;   // audio fell behind the render: resync with a small gap
        nextAudioTime = earliest + (framesIn === 1 ? 0.2 : 0);
      }
      const startAt = nextAudioTime;
      const ab = actx.createBuffer(1, SAMPLES_PER_FRAME, 16000);
      const ch = ab.getChannelData(0);
      for (let i = 0; i < SAMPLES_PER_FRAME; i++) ch[i] = pcm[i] / 32768;
      const src = actx.createBufferSource();
      src.buffer = ab;
      src.connect(actx.destination);
      src.start(startAt);
      src.onended = () => { sources = sources.filter(s => s !== src); };
      sources.push(src);
      nextAudioTime = startAt + FRAME_S;
      queue.push({ bitmap, playAt: startAt });
    })
    .catch(e => console.error("frame decode failed", e));
}

function connect() {
  ensureAudio();
  ws = new WebSocket($("url").value);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    $("disconnect").disabled = false;
    $("speak").disabled = false;
    $("interrupt").disabled = false;
    $("connect").disabled = true;
    setStatus();
  };
  ws.onmessage = e => {
    if (e.data instanceof ArrayBuffer) { onFrame(e.data); return; }
    const m = JSON.parse(e.data);
    if (m.type === "nurse_text") $("nurse").textContent = "Nurse: " + m.text;
  };
  ws.onclose = () => { setStatus("closed"); resetButtons(); };
  ws.onerror = () => setStatus("connection error (is the SSH forward running?)");
}

function resetButtons() {
  $("connect").disabled = false;
  $("disconnect").disabled = true;
  $("speak").disabled = true;
  $("interrupt").disabled = true;
  ws = null;
  started = false;
}

function interrupt() {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "flush" }));
  sources.forEach(s => { try { s.stop(); } catch (_) {} });
  sources = [];
  queue = [];
  nextAudioTime = 0;
  started = false;
}

// Parse a PCM16 mono 16 kHz WAV and return the raw sample bytes.
async function readWav16k(file) {
  const buf = await file.arrayBuffer();
  const dv = new DataView(buf);
  const tag = (o) => String.fromCharCode(dv.getUint8(o), dv.getUint8(o + 1), dv.getUint8(o + 2), dv.getUint8(o + 3));
  if (tag(0) !== "RIFF" || tag(8) !== "WAVE") throw new Error("not a WAV file");
  let off = 12, fmt = null, data = null;
  while (off + 8 <= dv.byteLength) {
    const id = tag(off), size = dv.getUint32(off + 4, true);
    if (id === "fmt ") fmt = { ch: dv.getUint16(off + 10, true), sr: dv.getUint32(off + 12, true), bits: dv.getUint16(off + 22, true) };
    if (id === "data") data = new Uint8Array(buf, off + 8, size);
    off += 8 + size + (size & 1);
  }
  if (!fmt || !data) throw new Error("missing fmt or data chunk");
  if (fmt.ch !== 1 || fmt.sr !== 16000 || fmt.bits !== 16) throw new Error("need 16 kHz mono 16-bit WAV");
  return data;
}

async function speak() {
  const file = $("wav").files[0];
  if (!file) { setStatus("choose a WAV file first"); return; }
  if (!ws || ws.readyState !== 1) return;
  const pcm = await readWav16k(file);
  if (!started) {
    ws.send(JSON.stringify({ type: "start", prebuffer_s: parseFloat($("prebuffer").value) || 0 }));
    started = true;
  }
  speaking = true;
  setStatus(`streaming ${(pcm.byteLength / 32000).toFixed(2)} s of speech`);
  for (let i = 0; i < pcm.byteLength; i += CHUNK_BYTES) {
    if (!ws || ws.readyState !== 1) break;
    ws.send(pcm.slice(i, i + CHUNK_BYTES));
    await new Promise(r => setTimeout(r, 100));   // live pace
  }
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "end" }));
  speaking = false;
  setStatus("speech sent");
}

async function startMic() {
  $("mic").disabled = true;
  try {
    const tokRes = await fetch("http://127.0.0.1:8768/token");
    const tok = await tokRes.json();
    if (!tokRes.ok || !tok.token) throw new Error(tok.error || "no token from token server");
    const url = "wss://api.elevenlabs.io/v1/speech-to-text/realtime?model_id=scribe_v2_realtime" +
                "&audio_format=pcm_16000&commit_strategy=vad&token=" + encodeURIComponent(tok.token);
    scribeWs = new WebSocket(url);
    scribeWs.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.message_type === "partial_transcript") $("partial").textContent = m.text;
      else if (m.message_type === "committed_transcript") {
        $("transcript").textContent += m.text + "\n";
        $("partial").textContent = "";
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "patient_text", text: m.text }));
      } else if (m.message_type && m.message_type !== "session_started") setStatus("scribe: " + JSON.stringify(m).slice(0, 200));
    };
    await new Promise((res, rej) => { scribeWs.onopen = res; scribeWs.onerror = () => rej(new Error("Scribe connection failed")); });

    micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = micCtx.createMediaStreamSource(micStream);
    micNode = micCtx.createScriptProcessor(4096, 1, 1);
    const ratio = micCtx.sampleRate / 16000;
    const pending = [];
    micNode.onaudioprocess = e => {
      const x = e.inputBuffer.getChannelData(0);
      const outLen = Math.floor(x.length / ratio);
      for (let i = 0; i < outLen; i++) {     // resample to 16 kHz (linear)
        const p = i * ratio, i0 = Math.floor(p), f = p - i0;
        pending.push(x[i0] * (1 - f) + (x[i0 + 1] ?? x[i0]) * f);
      }
      while (pending.length >= 1600) {       // 100 ms chunks
        const chunk = pending.splice(0, 1600);
        const pcm = new Int16Array(1600);
        for (let i = 0; i < 1600; i++) pcm[i] = Math.max(-32768, Math.min(32767, Math.round(chunk[i] * 32767)));
        const bytes = new Uint8Array(pcm.buffer);
        let bin = "";
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        if (scribeWs && scribeWs.readyState === 1)
          scribeWs.send(JSON.stringify({ message_type: "input_audio_chunk", audio_base_64: btoa(bin), sample_rate: 16000 }));
      }
    };
    const mute = micCtx.createGain();
    mute.gain.value = 0;                     // do not play the mic back through the speakers
    src.connect(micNode);
    micNode.connect(mute);
    mute.connect(micCtx.destination);
    $("mic").textContent = "Stop mic";
    $("mic").disabled = false;
    setStatus("mic on: speak to the nurse");
  } catch (e) {
    setStatus("mic error: " + e.message);
    stopMic();
  }
}

function stopMic() {
  if (micNode) micNode.disconnect();
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (micCtx) micCtx.close();
  if (scribeWs) scribeWs.close();
  micNode = micStream = micCtx = scribeWs = null;
  $("mic").textContent = "Start mic";
  $("mic").disabled = false;
  $("partial").textContent = "";
}

$("mic").onclick = () => { if (micStream || scribeWs) stopMic(); else startMic(); };
$("connect").onclick = connect;
$("disconnect").onclick = () => { if (ws) ws.close(); };
$("speak").onclick = speak;
$("interrupt").onclick = interrupt;
statsTimer = setInterval(() => setStatus(), 250);
requestAnimationFrame(drawLoop);
$("mic").disabled = false;
setStatus();
</script>
</body>
</html>
